services:
  db:
    image: postgres:16-alpine
    container_name: tochka_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tochka_rosta}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tochka_rosta}"]
      interval: 5s
      timeout: 5s
      retries: 5

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: tochka_gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_ENDPOINT_IP=${WG_ENDPOINT_IP:-}
      - WIREGUARD_ENDPOINT_PORT=${WG_ENDPOINT_PORT:-51820}
      - WIREGUARD_PUBLIC_KEY=${WG_PUBLIC_KEY:-}
      - WIREGUARD_PRIVATE_KEY=${WG_PRIVATE_KEY:-}
      - WIREGUARD_PRESHARED_KEY=${WG_PRESHARED_KEY:-}
      - WIREGUARD_ADDRESSES=${WG_ADDRESSES:-10.0.0.2/24}
      - HTTPPROXY=on
      - HTTPPROXY_LOG=off

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tochka_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tochka_rosta}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tochka_rosta}
      SECRET_KEY: ${SECRET_KEY:-tochka-rosta-prod-secret-key-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_PROXY: ${OPENROUTER_PROXY:-http://gluetun:8888}
      AI_PROXY: ${AI_PROXY:-http://gluetun:8888}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      db:
        condition: service_healthy
      gluetun:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tochka_frontend
    restart: unless-stopped
    environment:
      INTERNAL_BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ""
      BETA_MODE: ${BETA_MODE:-true}
      BETA_CODE: ${BETA_CODE:-tochka2026}
      SECRET_KEY: ${SECRET_KEY:-tochka-rosta-prod-secret-key-change-me}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: tochka_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: '/bin/sh -c "while :; do sleep 24h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\""'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot:latest
    container_name: tochka_certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot:rw
      - certbot_conf:/etc/letsencrypt:rw
    entrypoint: ""
    command: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  certbot_www:
  certbot_conf:
